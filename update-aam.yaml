name: Update AAM Data

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Download latest AAM file
        run: |
          curl -fsSL https://aam.earthrotation.net/aam_fcs_ser/aam_geos_fcs.txt -o data/aam_latest.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aam_latest.txt
          git diff --staged --quiet || git commit -m "Auto-update AAM data"
          git push
