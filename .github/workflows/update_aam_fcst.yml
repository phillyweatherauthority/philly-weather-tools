name: Update AAM Forecast (GEFS, manual)

on:
  # Manual only. The daily run now happens inside "Update AAM Data"
  # (update_aam_lat.yml), straight after the observed data is refreshed,
  # so the forecast is always anchored to a current observed row.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aam-data
  cancel-in-progress: false

jobs:
  fetch-gefs-aam:
    runs-on: ubuntu-latest
    timeout-minutes: 45    # 31 members × 7 days × byte-range fetch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (eccodes for GRIB2)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeccodes-dev libeccodes-tools

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-gefs-${{ hashFiles('**/requirements_aam_fcst.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-gefs-

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements_aam_fcst.txt

      - name: Fetch GEFS and compute AAM forecast anomalies
        run: python scripts/fetch_gfs_aam.py

      - name: Commit and push forecast data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/aam_fcst_mean_latest.txt      2>/dev/null || true
          git add data/aam_fcst_std_latest.txt       2>/dev/null || true
          git add data/aam_fcst_global_latest.txt    2>/dev/null || true
          git add data/aam_fcst_tend_mean_latest.txt 2>/dev/null || true
          git add data/aam_fcst_tend_std_latest.txt  2>/dev/null || true
          git add data/aam_fcst_global_tend_latest.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update GEFS AAM forecast [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git pull --rebase origin main
            git push
          fi
