name: Update AAM Data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data
      - run: curl -fsSL https://aam.earthrotation.net/aam_fcs_ser/aam_geos_fcs.txt -o data/aam_latest.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aam_latest.txt
          git diff --staged --quiet || git commit -m "Auto-update AAM data"
          git push
