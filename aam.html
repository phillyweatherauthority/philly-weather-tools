<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Global AAM Anomaly (Auto) - PhillyWeatherAuthority</title>
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <style>
    :root{--bg:#f4f6f8;--card:#fff;--border:#e6e6e6;--text:#111827;--muted:#4b5563;--pill-bg:#eef2ff;--pill-border:#dbe4ff;--pill-text:#1f2a66;}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;padding:16px;background:var(--bg);color:var(--text);}
    .wrap{max-width:980px;margin:0 auto;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.04);margin-bottom:12px;}
    h1{font-size:18px;margin:0 0 8px;}
    .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
    .pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--pill-bg);border:1px solid var(--pill-border);color:var(--pill-text);white-space:nowrap;}
    #chart{height:560px;}
    .status{font-size:12px;color:var(--muted);white-space:pre-wrap;line-height:1.35;margin-top:10px;}
    code{background:#f3f4f6;padding:2px 6px;border-radius:8px;}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>GLOBAL AAM ANOM (scaled by 1.E25)</h1>
    <div class="bar">
      <span class="pill">Source: <code>./data/aam_latest.txt</code></span>
      <span class="pill" id="seriesPill">Series: -</span>
      <span class="pill" id="rowsPill">Rows: -</span>
      <span class="pill" id="updatedPill">Updated: -</span>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <div id="chart"></div>
  </div>
</div>

<script>
const DATA_URL = "./data/aam_latest.txt";

const statusEl = document.getElementById("status");
const seriesPill = document.getElementById("seriesPill");
const rowsPill = document.getElementById("rowsPill");
const updatedPill = document.getElementById("updatedPill");

function setStatus(msg){ statusEl.textContent = msg; }
function setPill(el, txt){ el.textContent = txt; }

function parseAAMDate(tok){
  // 2015.07.20-12:00:00
  const m = String(tok || "").match(/^(\d{4})\.(\d{2})\.(\d{2})-(\d{2}):(\d{2}):(\d{2})$/);
  if (!m) return null;
  return new Date(Date.UTC(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +m[6]));
}

function toNum(tok){
  // Handle FORTRAN D exponent: 9.447420D+28 -> 9.447420E+28
  const s = String(tok ?? "").replace(/d/gi, "E");
  const v = Number(s);
  return Number.isFinite(v) ? v : NaN;
}

function extractHeaderNames(text){
  // Look for line like: "# Date MJD TAI H1 H2 H3 I31_noIB ... EF3_IB"
  const lines = text.split(/\r?\n/);
  for (const line of lines){
    const s = line.trim();
    if (!s.startsWith("#")) continue;
    const t = s.replace(/^#+\s*/, "");
    if (/\bDate\b/.test(t) && /\bMJD\b/.test(t)){
      return t.split(/\s+/).filter(Boolean);
    }
  }
  return null;
}

function parseRows(text){
  const lines = text.split(/\r?\n/);
  const rows = [];
  for (const line of lines){
    const s = line.trim();
    if (!s || s.startsWith("#") || s.startsWith("%") || s.startsWith("//")) continue;
    const parts = s.split(/\s+/);
    if (parts.length < 6) continue;
    const dt = parseAAMDate(parts[0]);
    if (!dt) continue;
    const nums = parts.slice(1).map(toNum);
    const finiteCount = nums.filter(Number.isFinite).length;
    if (finiteCount >= 5) rows.push({ dt, nums });
  }
  return rows;
}

function variance(arr){
  let n=0, mean=0, M2=0;
  for (const v of arr){
    if (!Number.isFinite(v)) continue;
    n++;
    const d = v - mean;
    mean += d/n;
    M2 += d*(v-mean);
  }
  return n>1 ? M2/(n-1) : 0;
}

function chooseSeriesIndex(mappedNames, rows, dataCols){
  // Hard preference: EF3_noIB, then EF3_IB, then EF2_noIB/IB, then EF1_noIB/IB
  const prefs = ["EF3_noIB","EF3_IB","EF2_noIB","EF2_IB","EF1_noIB","EF1_IB"];
  if (mappedNames){
    for (const p of prefs){
      const idx = mappedNames.findIndex(n => n.toUpperCase() === p.toUpperCase());
      if (idx !== -1) return idx;
    }
  }

  // If we couldn't map names, pick a column that looks like an anomaly: small-ish and variable.
  // Strategy: among all columns, compute variance of log10(|y|) after clipping zeros.
  let best = 0;
  let bestScore = -Infinity;
  for (let c=0;c<dataCols;c++){
    const y = rows.map(r => r.nums[c]).filter(Number.isFinite);
    if (y.length < Math.max(200, rows.length*0.4)) continue;

    // prefer columns with magnitudes around 1e-25..1e-20 AFTER scaling, which means raw around 1e-50..1e-45 (unlikely)
    // Instead: prefer columns whose median abs is relatively small vs typical mass terms.
    const abs = y.map(v => Math.abs(v)).sort((a,b)=>a-b);
    const med = abs[Math.floor(abs.length/2)] || 0;
    const v = variance(y);

    // Heuristic: penalize very large medians (mass terms ~1e28+)
    const penalty = med > 1e12 ? Math.log10(med) : 0; // huge penalty for big numbers
    const score = Math.log10(v + 1e-300) - penalty;
    if (score > bestScore){
      bestScore = score;
      best = c;
    }
  }
  return best;
}

function scale1e25(y){
  // This page is "scaled by 1.E25" like classic plots.
  return y.map(v => Number.isFinite(v) ? v * 1e25 : v);
}

async function main(){
  setStatus("Loading latest AAM data...");
  const url = DATA_URL + "?_ts=" + Date.now();

  try{
    const r = await fetch(url, { cache:"no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const text = await r.text();

    const rows = parseRows(text);
    if (!rows.length){
      setPill(rowsPill, "Rows: 0");
      setStatus("Could not parse data rows. Expected timestamp like 2015.07.20-12:00:00\n" +
                "If the file is a placeholder or HTML, the workflow may not be writing raw data.");
      return;
    }

    const dataCols = rows[0].nums.length;

    // Header names include Date as first token; our numeric columns start after timestamp -> map from index 1
    const header = extractHeaderNames(text);
    const mappedNames = (header && header.length >= dataCols+1) ? header.slice(1, 1+dataCols) : null;

    const yIdx = chooseSeriesIndex(mappedNames, rows, dataCols);
    const seriesName = mappedNames ? mappedNames[yIdx] : `Column ${yIdx+1}`;

    // Build time + series
    const x = rows.map(r => r.dt.toISOString());
    const yRaw = rows.map(r => r.nums[yIdx]);

    // Scale by 1e25 for classic plot
    const y = scale1e25(yRaw);

    // Plotly
    Plotly.newPlot("chart", [{
      x, y, mode:"lines", name: seriesName,
      hovertemplate: "%{x|%Y-%m-%d %H:%M} UTC<br>%{y:.3f}<extra></extra>"
    }],{
      title: "",
      xaxis: { title: "", tickformat: "%b\n%Y", showgrid:true },
      yaxis: { title: "", showgrid:true, zeroline:false },
      shapes: [{ type:"line", xref:"paper", x0:0, x1:1, y0:0, y1:0, line:{dash:"dash", width:1} }],
      margin: { l: 70, r: 20, t: 20, b: 70 }
    }, { responsive:true });

    setPill(seriesPill, `Series: ${seriesName}`);
    setPill(rowsPill, `Rows: ${rows.length}`);
    setPill(updatedPill, `Updated: ${new Date().toUTCString()}`);
    setStatus(
      `Auto-selected series: ${seriesName}\n` +
      `Notes: numbers parse FORTRAN D-exponents (e.g., 9.44D+28).\n` +
      `This chart is scaled by 1.E25 to match the classic “GLOBAL AAM ANOM” style.`
    );

  } catch(e){
    setStatus("Fetch error: " + String(e));
  }
}

main();
</script>
</body>
</html>
