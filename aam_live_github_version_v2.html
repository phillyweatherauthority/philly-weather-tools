<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relative AAM - Philly Weather Authority</title>
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; padding:16px; background:#f4f6f8; }
    h1 { font-size:18px; margin:0 0 10px; }
    #chart { height: 560px; background:#fff; border:1px solid #e6e6e6; border-radius:14px; }
    .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:10px 0 12px; }
    select, button { padding:8px 10px; border-radius:12px; border:1px solid #d0d0d0; background:#fff; }
    button { cursor:pointer; }
    button:hover { background:#f2f2f2; }
    .status { font-size:12px; color:#444; margin-top:10px; white-space:pre-wrap; }
    .pill { font-size:12px; padding:4px 8px; border-radius:999px; background:#eef2ff; border:1px solid #dbe4ff; color:#1f2a66; }
  </style>
</head>
<body>

<h1>Relative Atmospheric Angular Momentum (GEOS Forecast)</h1>

<div class="bar">
  <span class="pill" id="sourcePill">Source: Netlify proxy</span>

  <label for="smooth">Smoothing:</label>
  <select id="smooth">
    <option value="0">None</option>
    <option value="3">3-point mean</option>
    <option value="5">5-point mean</option>
    <option value="9">9-point mean</option>
  </select>

  <button id="refresh">Refresh</button>
</div>

<div id="chart"></div>
<div class="status" id="status"></div>

<script>
const proxyURL = "https://phillyweatherauthorityaam.netlify.app/.netlify/functions/aam";
const statusEl = document.getElementById("status");
const smoothEl = document.getElementById("smooth");
const refreshBtn = document.getElementById("refresh");

function movingAverage(arr, k) {
  if (!k || k <= 1) return arr.slice();
  const out = [];
  const half = Math.floor(k/2);
  for (let i=0;i<arr.length;i++) {
    let sum = 0, count = 0;
    for (let j=i-half;j<=i+half;j++) {
      if (j>=0 && j<arr.length && Number.isFinite(arr[j])) {
        sum += arr[j];
        count++;
      }
    }
    out.push(count ? (sum/count) : null);
  }
  return out;
}

// Robust parser: for each non-comment line, extract ALL numeric tokens with regex.
// This works even if the file includes date strings like 2026-02-25 or other text columns.
function parseNumericRows(text) {
  const lines = text.split(/\r?\n/);
  const rows = [];
  let firstUsefulLine = null;

  const numRe = /[-+]?\d*\.?\d+(?:[eE][-+]?\d+)?/g;

  for (const line of lines) {
    const s = line.trim();
    if (!s) continue;
    if (s.startsWith("#") || s.startsWith("%") || s.startsWith("//")) continue;

    const matches = s.match(numRe);
    if (matches && matches.length >= 2) {
      const nums = matches.map(Number).filter(Number.isFinite);
      if (nums.length >= 2) {
        rows.push(nums);
        if (!firstUsefulLine) firstUsefulLine = s;
      }
    }
  }
  return { rows, firstUsefulLine };
}

function plot(rows) {
  // X = index (safe default). Y = last numeric column (often relative AAM).
  const x = rows.map((_, i) => i);
  const yRaw = rows.map(r => r[r.length - 1]);
  const y = movingAverage(yRaw, Number(smoothEl.value));

  const trace = {
    x,
    y,
    mode: "lines",
    name: "Relative AAM (last numeric col)",
    hovertemplate: "Step %{x}<br>%{y}<extra></extra>"
  };

  const layout = {
    title: "Relative AAM vs Forecast Step",
    xaxis: { title: "Forecast step (row index)" },
    yaxis: { title: "Relative AAM anomaly" },
    margin: { l: 60, r: 20, t: 50, b: 60 },
    shapes: [{
      type: "line",
      x0: 0, x1: x.length,
      y0: 0, y1: 0,
      line: { dash: "dash", width: 1 }
    }]
  };

  Plotly.newPlot("chart", [trace], layout, { responsive: true });
}

async function fetchAndRender() {
  statusEl.textContent = "Loading latest AAM data...";
  try {
    const response = await fetch(proxyURL, { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const text = await response.text();
    const parsed = parseNumericRows(text);

    if (!parsed.rows.length) {
      statusEl.textContent =
        "Fetched data, but couldn't find numeric rows to plot.\n" +
        "This usually means your Netlify function is returning an error page or message instead of the .txt.\n\n" +
        "Open this in a browser to verify raw output:\n" + proxyURL + "\n\n" +
        "Tip: If you see a Netlify 404 page or an error string, the function is not deployed correctly yet.";
      return;
    }

    plot(parsed.rows);

    statusEl.textContent =
      "OK - Parsed " + parsed.rows.length + " rows.\n" +
      "Example parsed line: " + (parsed.firstUsefulLine || "(none)") + "\n" +
      "Last updated: " + new Date().toUTCString() + "\n" +
      "Proxy: " + proxyURL;
  } catch (err) {
    statusEl.textContent =
      "Fetch error: " + String(err) + "\n\n" +
      "Open this URL to debug (should show raw text):\n" + proxyURL;
  }
}

smoothEl.addEventListener("change", fetchAndRender);
refreshBtn.addEventListener("click", fetchAndRender);

// Auto-fetch on load
fetchAndRender();
</script>

</body>
</html>
